name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-and-script-checks:
    name: Validate project files and setup scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository structure and Bash scripts
        shell: bash
        run: bash scripts/validate-repo.sh
