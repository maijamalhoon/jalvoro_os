name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-and-script-checks:
    name: Validate project files and setup scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify required project documents
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md ROADMAP.md CONTRIBUTING.md SECURITY.md docs/MASTER_PLAN.md docs/ARCHITECTURE.md docs/DEVELOPMENT_ENVIRONMENT.md docs/ANDROID_STACK_MAP.md docs/TESTING.md scripts/setup-ubuntu.sh scripts/check-host.sh; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required file is missing or empty: $file"
              exit 1
            fi
          done
          echo "Required Jalvoro OS project documents are present."
      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/setup-ubuntu.sh
          bash -n scripts/check-host.sh
          echo "Shell syntax checks passed."
